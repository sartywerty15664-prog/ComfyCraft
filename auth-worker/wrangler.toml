name = "comfycraft-ely-auth"
main = "src/index.ts"
compatibility_date = "2026-11-08"

[[durable_objects.bindings]]
name = "OAUTH_SESSIONS"
class_name = "OAuthSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OAuthSession"]

[vars]
# Set ELY_CLIENT_ID and ELY_REDIRECT_URI with wrangler secret/vars commands.
# ELY_CLIENT_SECRET must be stored as a Wrangler secret, never committed.
