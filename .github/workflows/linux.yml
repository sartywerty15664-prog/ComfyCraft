name: Linux checks and AppImage

on:
  push:
    branches: [main, feature/multicore-runtime]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libfuse2t64
      - name: Validate Ely.by OAuth worker
        working-directory: auth-worker
        run: |
          npm install
          npm run typecheck
          npm run dry-run
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Linux AppImage
        run: pnpm tauri build --bundles appimage
      - name: Upload Linux AppImage preview
        uses: actions/upload-artifact@v4
        with:
          name: ComfyCraft-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
