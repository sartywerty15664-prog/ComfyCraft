[package]
name = "comfycraft"
version = "0.1.0"
description = "A comfortable Linux-first Minecraft Java launcher"
authors = ["ComfyCraft contributors"]
edition = "2021"

[lib]
name = "comfycraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10"
futures-util = "0.3"
